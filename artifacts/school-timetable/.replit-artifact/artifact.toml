kind = "web"
previewPath = "/"
title = "School Timetable Manager"
version = "1.0.0"
id = "artifacts/school-timetable"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23565
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/school-timetable run dev"

[services.env]
PORT = "23565"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/school-timetable", "run", "build"]
publicDir = "artifacts/school-timetable/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
